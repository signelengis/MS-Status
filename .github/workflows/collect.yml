name: Collect status

on:
  schedule:
    # Every 10 minutes. GitHub may start scheduled runs a few minutes late at busy times.
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", "config/**", ".github/workflows/collect.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Collect status feeds and run web checks
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/collect.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
